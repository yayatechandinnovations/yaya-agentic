name: yayaagenticchat
description: "Yaya — branded end-user chat app. Scan a QR, pick a business tile, chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Path URL strategy for clean web deep links (https://chat.yaya.app/e/{handle}).
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.3

  # Networking + SSE
  dio: ^5.9.2

  # Persistence (on-device directory of added tiles + per-tile sessionId)
  shared_preferences: ^2.5.5

  # QR add-a-tile on-ramp
  mobile_scanner: ^5.2.3

  # Commerce checkout: open the PSP hosted-checkout page (hosted_url mode).
  url_launcher: ^6.3.1

  # Commerce checkout: mount the PSP drop-in for the payment_intent mode
  # (clientSecret + publishableKey arrive in the checkout_result payload).
  # flutter_stripe_web supplies the web implementation.
  flutter_stripe: ^11.1.0
  flutter_stripe_web: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/yaya-chat-logo.png

# App icon: the neon Yaya logo on the dark brand background. iOS gets an opaque
# icon (no alpha allowed); Android uses an adaptive icon with the dark bg + the
# transparent logo as the foreground.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#0E0B1A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0E0B1A"
    theme_color: "#0E0B1A"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
