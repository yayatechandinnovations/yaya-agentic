name: yayaagenticchat
description: "Yaya — branded end-user chat app. Scan a QR, pick a business tile, chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Path URL strategy for clean web deep links (https://chat.yaya.app/e/{handle}).
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # State + routing
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.3

  # Networking + SSE
  dio: ^5.9.2

  # Persistence (on-device directory of added tiles + per-tile sessionId)
  shared_preferences: ^2.5.5

  # Secret credentials (device pass + device secret) live in platform secure
  # storage, never plain prefs (chat-experience-design.md §5.5).
  flutter_secure_storage: ^9.2.2

  # QR add-a-tile on-ramp
  mobile_scanner: ^5.2.3

  # Commerce checkout: open the PSP hosted-checkout page (hosted_url mode).
  url_launcher: ^6.3.1

  # Chat media (chat-experience-design.md §6): pick photos/documents, record
  # voice notes, and play them back. All three support web.
  file_picker: ^8.1.2
  record: ^5.1.2
  just_audio: ^0.9.40

  # Receipt/ticket previews (chat-experience-design.md §7): real Code-128 and
  # QR marks on the thermal-paper widget. Pure Dart, web-safe.
  barcode_widget: ^2.0.4

  # Browser-native fetch for reading recorded blob: URLs (Firefox blocks XHR
  # on blob:, so Dio/XHR reads come back empty there).
  web: ^1.1.0

  # Commerce checkout: mount the PSP drop-in for the payment_intent mode
  # (clientSecret + publishableKey arrive in the checkout_result payload).
  # flutter_stripe_web supplies the web implementation.
  flutter_stripe: ^11.1.0
  flutter_stripe_web: ^6.1.0

  # Push: content-free wake nudges over FCM/APNs when an inbound/system message
  # arrives (system-messaging §11 / chat-mobile-publishing-and-push §B). All
  # push wiring degrades to a no-op when Firebase isn't configured, so dev/web
  # builds and `flutter test` run without any Firebase project.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Renders a heads-up notification for messages that arrive while the app is
  # foregrounded (the OS tray handles background/terminated automatically).
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Lets tests simulate a missing secure-storage channel (the web
  # stale-registrant incident) against the platform interface directly.
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/yaya-chat-logo.png
    - assets/yayachat-logo-1.png

# App icon: the square Yaya mark (circuit-Y speech bubble) on white. iOS gets an
# opaque icon; Android's adaptive icon sits on a white background so the mark
# reads the same as the legacy/iOS icon. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/yayachat-logo-1.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/yayachat-logo-1.png"
  web:
    generate: true
    image_path: "assets/yayachat-logo-1.png"
    background_color: "#0E0B1A"
    theme_color: "#0E0B1A"
  macos:
    generate: true
    image_path: "assets/yayachat-logo-1.png"
  windows:
    generate: true
    image_path: "assets/yayachat-logo-1.png"
