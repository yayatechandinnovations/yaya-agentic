# Add these blocks INSIDE the existing yayaagentic.smartlottery.do server{} block
# (the HTTPS/443 one), BEFORE its `location /` catch-all. They expose
# yaya-identity at https://yayaagentic.smartlottery.do/identity/ by proxying to
# the identity console container (:8091). The /identity prefix is preserved
# (no trailing slash on proxy_pass) so the issuer paths line up.

# Bare /identity → /identity/ so relative asset URLs resolve.
location = /identity { return 301 /identity/; }

location /identity/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # TLS terminates at this vhost
    proxy_http_version 1.1;
}
