name: yaya_identity_console
description: Admin console for yaya-identity — clean architecture + BLoC (event/state).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5
  dio: ^5.7.0
  go_router: ^14.6.0
  get_it: ^7.7.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
