spring:
  application:
    name: yaya-sales
  servlet:
    multipart:
      # Image uploads (product photos, catalog covers). The media service
      # enforces its own 5MB/type checks; these are transport-layer ceilings.
      max-file-size: 6MB
      max-request-size: 8MB
  datasource:
    url: ${SALES_DB_URL:jdbc:postgresql://localhost:5432/yaya_sales}
    username: ${SALES_DB_USER:postgres}
    password: ${SALES_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema; Hibernate never mutates it.
    open-in-view: false
    properties:
      hibernate:
        default_schema: yaya_sales
  flyway:
    enabled: true
    # Own schema, zero cross-schema FKs/joins (design §12.4 / decision 5) — a
    # shared Postgres instance is fine in v1, and the app lifts to its own
    # instance with no query changes.
    schemas: yaya_sales
    default-schema: yaya_sales
    create-schemas: true
    locations: classpath:db/migration

server:
  port: ${SALES_PORT:8092}

yaya:
  sales:
    secrets:
      # base64-encoded 32-byte AES-256 master key — generate with `openssl rand -base64 32`.
      # Encrypts PSP/carrier credentials and KYC documents at rest (design §15).
      encryption-key: ${YAYA_SALES_SECRETS_ENCRYPTION_KEY:}
    auth:
      # OIDC issuer whose JWTs authenticate operators (admin API) and forwarded
      # shopper principals (agent API). Same issuer trust yaya-agentic uses
      # (design §11.3) — e.g. the yaya-identity deployment. Blank = JWT auth off
      # (only service tokens can authenticate; endpoints stay locked).
      issuer-uri: ${YAYA_SALES_AUTH_ISSUER_URI:}
      # Per-tenant HMAC secrets (base64) verifying X-Yaya-Service-Token minted by
      # yaya-agentic's HttpToolDispatcher. Map: tenantId -> base64 secret.
      service-secrets: {}
      # Origins allowed to call this API from a browser (the admin console,
      # the courier surface). Empty = CORS off.
      cors-allowed-origins: ${YAYA_SALES_CORS_ALLOWED_ORIGINS:}
      # Admin-plane tenant binding (§15): the operator JWT claim whose value
      # must equal the store's tenant id. Enforcement is ON by default;
      # single-merchant deployments whose issuer mints no tenant claim can
      # opt out explicitly.
      operator-tenant-claim: ${YAYA_SALES_OPERATOR_TENANT_CLAIM:org}
      enforce-operator-tenant: ${YAYA_SALES_ENFORCE_OPERATOR_TENANT:true}
    outbox:
      poll-enabled: ${SALES_OUTBOX_POLL_ENABLED:true}
      poll-interval-ms: ${SALES_OUTBOX_POLL_INTERVAL_MS:2000}
    notifications:
      # Post-purchase updates → the shopper's chat, via yaya-agentic's trusted
      # system-message ingest (design §11.3/§13; system-messaging-design.md §5).
      # Disabled by default: no publisher bean is registered, so outbox rows are
      # only marked published by whatever other consumers exist.
      enabled: ${SALES_NOTIFICATIONS_ENABLED:false}
      # The yaya-agentic deployment that fronts the shopper's chat.
      agent-base-url: ${SALES_NOTIFICATIONS_AGENT_BASE_URL:http://localhost:8080}
      # URL parts of POST /v1/integrations/{tenantId}/senders/{senderId}/messages.
      tenant-id: ${SALES_NOTIFICATIONS_TENANT_ID:}
      sender-id: ${SALES_NOTIFICATIONS_SENDER_ID:}
      # Bearer credential the sender's configured trust verifies (shared-secret
      # JWT / API key carrying system:inbound:send). Opaque to yaya-sales.
      sender-token: ${SALES_NOTIFICATIONS_SENDER_TOKEN:}
    inventory:
      # Abandoned-cart holds are released automatically (§7.3): HELD past
      # expires_at → EXPIRED, availability recovers.
      sweep-enabled: ${SALES_INVENTORY_SWEEP_ENABLED:true}
      sweep-interval-ms: ${SALES_INVENTORY_SWEEP_INTERVAL_MS:30000}
    delivery:
      # Courier fleet (design §8.9). otp-echo-enabled returns the registration
      # OTP in the register response for DEV/TEST ONLY — production keeps it
      # false and delivers the OTP out-of-band (SMS wired to the
      # delivery_agent.registered outbox event). Stored hashed either way.
      otp-echo-enabled: ${SALES_DELIVERY_OTP_ECHO_ENABLED:false}
      otp-ttl-minutes: ${SALES_DELIVERY_OTP_TTL_MINUTES:10}
      invite-ttl-hours: ${SALES_DELIVERY_INVITE_TTL_HOURS:72}
