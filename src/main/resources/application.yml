spring:
  application:
    name: yaya-agentic
  codec:
    # WebFlux buffers request bodies in memory; the 256KB default is too small
    # for base64 logo uploads (chat entry points, ≤2MB image → ~2.7MB body).
    max-in-memory-size: 4MB
  webflux:
    multipart:
      # Knowledge-file uploads (design §10). Parts above this stream to a temp
      # file instead of the heap, so a 25MB PDF never sits fully in memory on
      # the event loop; the per-file/-request/-tenant caps are enforced in
      # KnowledgeUploadService against yaya.agentic.knowledge.*.
      max-in-memory-size: 1MB
      max-disk-usage-per-part: 30MB
      max-parts: 64
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Local dev: Spring Boot's docker-compose integration registers a
  # ServiceConnection from compose.yaml automatically — no datasource
  # block needed. Production: set DB_URL / DB_USERNAME / DB_PASSWORD via
  # env vars and the standard SPRING_DATASOURCE_* mapping picks them up.

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
    openai:
      # Used for embeddings always and for chat when YAYA_LLM_PROVIDER=openai.
      # Without a key the embedding bean is absent and we fall back to the
      # deterministic stub so the app boots without OpenAI.
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: text-embedding-3-small
    # `spring.ai.model.*` is the global provider switch. We tie chat to
    # YAYA_LLM_PROVIDER so flipping that env var alone selects which chat
    # autoconfig fires (anthropic, openai, …). Image / audio / moderation
    # stay off because we don't use them and their auto-configs demand a
    # key on startup.
    model:
      chat: ${YAYA_LLM_PROVIDER:anthropic}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      embedding: ${YAYA_EMBEDDING_PROVIDER:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0

yaya:
  agentic:
    default-personality: default
    default-tenant: default
    knowledge:
      # Uploaded knowledge files (docs/design/knowledge-file-upload-design.md).
      # blob-store: db keeps bytes in Postgres (zero extra infra); switch to
      # "minio" once a MinioBlobStore/bucket is wired. Caps mirror §11.
      blob-store: ${YAYA_KNOWLEDGE_BLOB_STORE:db}
      max-file-bytes: 26214400          # 25 MiB per file
      max-request-bytes: 104857600      # 100 MiB per upload request
      max-tenant-corpus-bytes: 2147483648  # 2 GiB per tenant
      # Malware scanning is off until a ClamAV scanner is wired — the NoOp
      # scanner warns loudly. Turn on with a ClamAvMalwareScanner present.
      malware-scan-enabled: ${YAYA_KNOWLEDGE_MALWARE_SCAN:false}
      ingestion:
        # Async ingestion worker (design §9). Uploaded sources auto-enqueue a
        # durable job; the worker claims via SKIP LOCKED and retries with
        # exponential backoff. Disable to turn off background processing.
        worker-enabled: ${YAYA_KNOWLEDGE_INGEST_WORKER:true}
        poll-interval-ms: 3000
        batch-size: 4
        max-attempts: 5
        base-backoff: 30s
        max-backoff: 1h
      gc:
        # Orphaned-blob sweep (design §11). Deletes uploaded bytes no live
        # source version references, after a grace window so just-uploaded
        # not-yet-attached files survive.
        enabled: ${YAYA_KNOWLEDGE_GC:true}
        grace-hours: 24
        interval-ms: 3600000      # hourly
        initial-delay-ms: 300000  # 5 min after boot
      minio:
        # Only used when blob-store=minio. Self-hosted S3-compatible storage.
        endpoint: ${YAYA_MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${YAYA_MINIO_ACCESS_KEY:}
        secret-key: ${YAYA_MINIO_SECRET_KEY:}
        bucket: ${YAYA_MINIO_BUCKET:yaya-knowledge}
      clamav:
        # Only used when malware-scan-enabled=true. Self-hosted ClamAV daemon.
        host: ${YAYA_CLAMAV_HOST:localhost}
        port: ${YAYA_CLAMAV_PORT:3310}
        timeout-ms: 10000
    # Public origin of the admin SPA — used to build clickable links in
    # verify / reset / invitation emails. In prod set to the URL users
    # type into their browser (e.g. https://admin.smartlottery.do). Leave
    # the default for local dev where the backend serves the SPA itself.
    public-base-url: ${YAYA_PUBLIC_BASE_URL:http://localhost:8080}
    chat:
      # Prefix the chat QR / share link is built from (this + the entry-point
      # handle). It MUST point at the public origin that serves the chat web
      # app (yayaagenticchat) — which is independent of this backend's own
      # address and changes per deployment, so it has to be set per env, not
      # left at the default. The app's host-agnostic /e/:handle route resolves
      # whatever origin this points at. Trailing slash required.
      deep-link-base: ${YAYA_CHAT_DEEP_LINK_BASE:http://localhost:8080/e/}
      verify:
        # Twilio Verify API base. Override only when stubbing Twilio in tests.
        base-url: ${TWILIO_VERIFY_BASE_URL:https://verify.twilio.com}
        # NOTE: twilio-service-sid (VA…) is deliberately NOT defaulted here. It
        # toggles the real OTP verifier via @ConditionalOnProperty, and an empty
        # value counts as "present" — which would switch the real verifier on
        # with a blank SID and fail every OTP. Set it only where Twilio is
        # wired, via env YAYA_AGENTIC_CHAT_VERIFY_TWILIO_SERVICE_SID. Unset →
        # DevNoopPhoneVerifier (any code passes) for offline dev.
    channels:
      # Platform-singleton Twilio account — shared by chat phone verification
      # (§20), SMS, and WhatsApp. Blank credentials → those channels disable
      # themselves (isConfigured() == false) instead of failing health checks,
      # so dev/test boot without Twilio at all.
      twilio:
        account-sid:           ${TWILIO_ACCOUNT_SID:}
        api-key-sid:           ${TWILIO_API_KEY_SID:}
        api-key-secret:        ${TWILIO_API_KEY_SECRET:}
        # Account Auth Token — verifies inbound webhook signatures
        # (X-Twilio-Signature) and is the Verify auth fallback when no API key.
        auth-token:            ${TWILIO_AUTH_TOKEN:}
        # Host Twilio dials back for inbound + status callbacks. Blank → falls
        # back to yaya.agentic.public-base-url.
        webhook-base-url:      ${TWILIO_WEBHOOK_BASE_URL:}
        # Optional Messaging Service SID (MG…) — outbound SMS/WhatsApp pooling
        # and sticky-sender routing. Blank → dispatch uses a plain From number.
        messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
        # A2P 10DLC bundles — only needed to register SMS brands/campaigns.
        a2p:
          customer-profile-bundle-sid: ${TWILIO_A2P_CUSTOMER_PROFILE_BUNDLE_SID:}
          a2p-profile-bundle-sid:      ${TWILIO_A2P_PROFILE_BUNDLE_SID:}
    session:
      # Idle TTL for ephemeral session state in Redis. Bumped on every
      # interaction; reaching zero auto-evicts working memory.
      idle-timeout: PT30M
    llm:
      provider: ${YAYA_LLM_PROVIDER:stub}   # stub | anthropic
    cors:
      allowed-origins:
        - "http://localhost:*"
        - "http://127.0.0.1:*"
    http-tools:
      # OPTIONAL platform-wide kill-switch on outbound HTTP tool hosts.
      # Empty list (default) = no platform-level gate; per-tenant
      # authorization is supplied structurally by BaseUrlResolver, which
      # constrains the dispatched host to tenant.hostBaseUrl (or an entry
      # in tenant.hostBaseUrlAllowlist for X-Yaya-Host-Base-Url overrides).
      # Set this only if you want a deployment-wide "this cluster can
      # only ever call X" guard on top of per-tenant config. SSRF guard
      # (allow-private-networks) still applies regardless.
      egress-allowlist: []
      # SSRF guard. Default refuses RFC1918 / loopback / link-local /
      # multicast / any-local. Tests can override per call.
      allow-private-networks: ${YAYA_HTTP_TOOLS_ALLOW_PRIVATE:false}
      default-timeout: PT10S
    auth:
      # Dev default: anonymous sessions allowed when no other authenticator
      # recognises the request. Production deploys MUST set this to false.
      allow-anonymous: ${YAYA_AUTH_ALLOW_ANONYMOUS:true}
      oidc:
        issuers: []
        jwks-cache-ttl: PT10M
        clock-skew: PT30S
      service-token:
        # Map<tenantId, secret>. Secret is an HMAC key, NOT a bearer token.
        tenant-secrets: {}
      delegated-host:
        # Base64-encoded raw Ed25519 public key (32 bytes). Empty disables.
        public-key-pem: ""

    # Operator console authentication — see docs/design/operator-auth-design.md.
    # Distinct from `auth` above, which authenticates conversational callers.
    operator-auth:
      bootstrap:
        # Break-glass admin login. Keep on in dev so the bundled `admin`/`admin`
        # login works; flip to false in prod ONCE you've registered at least
        # one platform-admin user via signup (M5a).
        enabled: ${YAYA_BOOTSTRAP_ENABLED:true}
        username: ${YAYA_BOOTSTRAP_USERNAME:admin}
        # Prefer YAYA_BOOTSTRAP_PASSWORD_HASH in prod. Plaintext below is
        # hashed at boot; leaving it as the default triggers a [SECURITY]
        # warning every boot.
        password: ${YAYA_BOOTSTRAP_PASSWORD:admin}
        password-hash: ${YAYA_BOOTSTRAP_PASSWORD_HASH:}
      session:
        cookie-name: YAYA_SESSION
        ttl: PT8H
        sliding-window: PT1H
        # Local dev runs over HTTP; flip via env in prod.
        cookie-secure: ${YAYA_SESSION_COOKIE_SECURE:false}

    # Self-serve user accounts & workspaces (M5a) — see
    # docs/specs/user-accounts/PRD.md. THE LOAD-BEARING FLAG. When false,
    # every /v1/auth/{signup,verify,...} route 404s and AdminController
    # falls back to the legacy default-tenant behaviour. Flip to true
    # only after the V20–V22 migrations have applied.
    user-accounts:
      enabled: ${YAYA_USER_ACCOUNTS_ENABLED:false}
      # When true, the FIRST user that signs up after this boot is granted
      # the platform-admin flag. Use during initial prod bring-up only;
      # flip back to false after the first signup completes.
      # NOTE: the wiring that consults this flag ships with M5b — today
      # promote the first user manually via SQL.
      first-user-is-platform-admin: ${YAYA_FIRST_USER_IS_PLATFORM_ADMIN:false}
      password:
        min-length: 12
        # ≥3 of {lowercase, uppercase, digit, symbol}.
        classes-required: 3
      verification:
        token-ttl: PT24H
        resend-cooldown: PT60S
        resend-per-hour-cap: 5
      reset:
        token-ttl: PT1H
      invitation:
        token-ttl: P7D
      sessions:
        # user-password sessions stay valid longer than break-glass
        # bootstrap sessions, which are deliberately short-lived.
        user-ttl: PT12H
        bootstrap-ttl: PT1H

    # Outbound email used by signup/verify/reset/invitation flows.
    # Provider defaults to dev-console — the raw token + body land in
    # the application log (grep for `[MAIL]`). Switch to sendgrid in
    # prod and set SENDGRID_API_KEY.
    # Provider=sendgrid hits SendGrid's HTTPS v3 /mail/send endpoint;
    # boot fails fast with a clear error if SENDGRID_API_KEY is blank.
    email:
      enabled: ${YAYA_EMAIL_ENABLED:true}
      provider: ${YAYA_EMAIL_PROVIDER:dev-console}        # sendgrid | dev-console
      from: ${YAYA_EMAIL_FROM:noreply@yaya.local}
      reply-to: ${YAYA_EMAIL_REPLY_TO:}
      sendgrid:
        api-key: ${SENDGRID_API_KEY:}
      outbox:
        max-retries: 3
        backoff-initial: PT30S
        backoff-multiplier: 2.0
        drainer-fixed-rate: PT60S
        batch-size: 100

logging:
  level:
    com.yayatechandinnovations.yayaagentic: INFO
